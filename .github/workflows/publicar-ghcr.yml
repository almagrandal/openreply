name: Publicar imagen en GHCR (NOR/AI)

# Compila el Dockerfile del repo para linux/amd64 (el VPS de Hetzner es x86_64)
# y lo publica en ghcr.io/<usuario>/openreply con la etiqueta sha-<commit>.
# Usa solo el GITHUB_TOKEN del propio workflow: sin tokens nuevos ni Docker Hub.
# Solo se lanza a mano (workflow_dispatch) y siempre construye el commit fijado.

on:
  workflow_dispatch:

env:
  COMMIT: dca8713249f979fda8d677a272ffb724ee205b93
  SHORT: dca8713

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (commit fijado)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Comprobar que el checkout es el commit esperado
        run: test "$(git rev-parse HEAD)" = "${{ env.COMMIT }}"

      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openreply" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR con GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SHORT }}
